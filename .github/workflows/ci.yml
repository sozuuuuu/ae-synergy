name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 火力計算のエンジン（link:anaden-mcp）。anaden-mcp は private なので、読み取り専用のトークンで取ってくる
      - uses: actions/checkout@v7
        with:
          repository: sozuuuuu/anaden-mcp
          token: ${{ secrets.ANADEN_MCP_TOKEN }}
          path: .anaden-mcp
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun link
        working-directory: .anaden-mcp
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
